server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: fall back to the prerendered index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change — cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML must not be cached, so a new deploy is visible immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Static SEO files.
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 256;
}
